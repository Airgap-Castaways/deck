<svg width="120" height="32" viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="deck">
  <!-- Stacked layer mark: 3 layers with a gap/break between top two (air-gap visual) -->
  <g fill="currentColor">
    <!-- Top layer (online side) -->
    <rect x="0" y="0" width="24" height="5" rx="1"/>
    <!-- Air-gap break: deliberate 3px gap with no bar, just space -->
    <!-- Middle layer (bundle) -->
    <rect x="0" y="9" width="24" height="5" rx="1"/>
    <!-- Bottom layer (target) -->
    <rect x="0" y="18" width="24" height="5" rx="1"/>
    <!-- Gap indicator: two tiny tick marks flanking the gap -->
    <rect x="26" y="6.5" width="2" height="2" rx="0.5" opacity="0.5"/>
    <rect x="26" y="14.5" width="2" height="2" rx="0.5" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text
    x="34"
    y="22"
    font-family="Archivo, 'Arial Narrow', sans-serif"
    font-weight="800"
    font-size="20"
    letter-spacing="-0.5"
    fill="currentColor"
  >deck</text>
</svg>
